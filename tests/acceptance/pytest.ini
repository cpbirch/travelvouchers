[pytest]
# Acceptance Test Configuration for Voucher Generation System

# Test discovery
testpaths = voucher_generation
python_files = test_*.py *_steps.py
python_functions = test_*

# BDD Configuration
bdd_features_base_dir = voucher_generation

# Markers for selective test execution
markers =
    walking_skeleton: Walking skeleton scenarios (run first)
    milestone_1: Milestone 1 - Validation (US-010)
    milestone_2: Milestone 2 - Templates and Merging (US-002, US-004, US-005)
    milestone_3: Milestone 3 - Output Generation (US-006, US-007, US-008)
    milestone_4: Milestone 4 - Robustness (US-003, US-009, US-011)
    critical: Critical path scenarios
    skip: Scenarios not yet implemented
    us_001: User Story 001 - Walking Skeleton
    us_002: User Story 002 - Load Templates
    us_003: User Story 003 - Validate Placeholders
    us_004: User Story 004 - Merge Customer Data
    us_005: User Story 005 - Merge Service Data
    us_006: User Story 006 - Generate PDF
    us_007: User Story 007 - Generate HTML
    us_008: User Story 008 - Store and Return URLs
    us_009: User Story 009 - Idempotency
    us_010: User Story 010 - Validate Request Data
    us_011: User Story 011 - Structured Errors

# Output formatting
addopts =
    --tb=short
    --strict-markers
    -v

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
